services:
  frontend:
    build:
      context: ./frontend
    container_name: logcenter-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: logcenter-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8420}:8000"
    depends_on:
      - opensearch-node

  opensearch-node:
    image: opensearchproject/opensearch:2.11.1
    container_name: opensearch-node
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  opensearch-data:
