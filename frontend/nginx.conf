# Frontend container nginx: serves the built SPA and proxies the API.
#
# The app is deployment-agnostic: it is always served at "/" and talks to its
# API at the relative path "/api". This nginx strips the "/api" prefix and
# forwards requests to the backend service, so the frontend never needs to know
# the backend's host, port, or the public domain it runs behind.
#
# BACKEND_ORIGIN is templated at container start (see docker entrypoint env);
# defaults to the compose service name so it works out of the box.

server {
    listen 80;
    server_name _;

    # Serve static assets and fall back to index.html for SPA client routing.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy: /api/logs/search -> backend /logs/search
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
